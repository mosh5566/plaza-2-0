<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>PLAZA · 50 רקעים לעיצוב #258</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --acc:#2563EB;--acc2:#1D4ED8;--acc-soft:#E7EEFE;--acc-rgb:37,99,235;
 --ok:#16A34A;--text:#0F1115;--sub:#5B6470;--mut:#969CA8;
 --surface:#FFFFFF;--surface2:#F1F3F6;--line:rgba(15,17,21,.05);
 --shadow-sm:0 1px 4px rgba(15,17,21,.04);
}
body{font-family:Heebo,Inter,sans-serif;background:#F7F8FA;color:var(--text);padding:30px 22px;direction:rtl;-webkit-font-smoothing:antialiased}
.page-h{max-width:1440px;margin:0 auto 30px;text-align:center}
.page-h h1{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:8px}
.page-h h1 b{color:var(--acc)}
.page-h p{color:var(--sub);font-size:13.5px;max-width:680px;margin:0 auto;line-height:1.55;font-weight:500}
.grid{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:22px}
.demo{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(15,17,21,.05);border:.5px solid var(--line)}
.demo-num{padding:11px 16px;background:#0F1115;color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.demo-num span{color:#969CA8;font-weight:500;font-size:11px}
.demo-stage{padding:22px;min-height:140px;display:flex;align-items:center;justify-content:center}
.hdr{width:100%;max-width:380px;text-align:center}
.hdr .gtag{display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:5px;color:var(--sub);font-size:11px;font-weight:800;letter-spacing:-.1px}
.hdr .gtag.dark{color:rgba(255,255,255,.95)}
.hdr .stat{display:flex;margin:0 0 5px;background:var(--surface);border:1.5px solid var(--acc);border-radius:11px;padding:5px 0;box-shadow:0 2px 10px rgba(var(--acc-rgb),.08)}
.hdr .st{flex:1;padding:2px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--acc-soft)}
.hdr .st:last-child{border-left:none}
.hdr .st b{color:var(--text);font-size:15px;font-weight:900;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:4px}
.hdr .st small{color:var(--sub);font-size:8.5px;font-weight:700;margin-top:1px}
.hdr .st .blue{color:var(--acc)}
.hdr .st .green{color:var(--ok)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.7)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.flag-anim{display:inline-block;animation:flag-cycle 3s infinite}
@keyframes flag-cycle{0%,33%{opacity:1}40%,49%{opacity:0}50%,82%{opacity:1}}
.hdr .idrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:9.5px;color:var(--sub);font-weight:700}
.hdr .idrow .chip{background:var(--surface);padding:2px 7px;border-radius:8px;border:1px solid rgba(15,17,21,.06);white-space:nowrap}
.hdr.dark .idrow{color:rgba(255,255,255,.92)}
.hdr.dark .idrow .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.section-h{grid-column:1/-1;padding:12px 18px;display:flex;align-items:center;gap:10px}
.section-h::before,.section-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#d2d2d7,transparent)}
.section-h b{color:#5B6470;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>

<div class="page-h">
  <h1>50 רקעים לעיצוב <b>#258</b></h1>
  <p>אותה כותרת בדיוק (מסגרת כחולה + סטטיסטיקות + שורת זהות), עם 50 רקעים שונים. ממוספרים 281-330. תגיד מספר.</p>
</div>

<div class="grid" id="grid"></div>

<div style="max-width:1440px;margin:40px auto 0;text-align:center;padding:22px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(15,17,21,.05)">
  <h2 style="font-size:20px;font-weight:800;color:#0F1115;margin-bottom:6px">בחרת רקע? תגיד מספר.</h2>
  <p style="font-size:13px;color:#5B6470">דוגמה: <b>"תפעיל רקע #305"</b> או <b>"#315 אבל פחות רווי"</b></p>
  <p style="font-size:11.5px;color:#969CA8;margin-top:8px">דפים קודמים: <a href="headers.html" style="color:#2563EB">1-50</a> · <a href="headers-pro.html" style="color:#2563EB">51-150</a> · <a href="headers-final.html" style="color:#2563EB">151-250</a> · <a href="headers-159.html" style="color:#2563EB">251-280</a> · דף זה (281-330)</p>
</div>

<script>
const HDR=(dark)=>`<div class="hdr${dark?' dark':''}">

  <div class="st"><b class="blue">500</b><small>👥 חברים שהצטרפו</small></div>
  <div class="st"><b class="green"><span class="live-dot"></span>247</b><small>⚡ מחוברים בלייב</small></div>
  <div class="st"><b class="blue">445</b><small>📝 פוסטים שעלו לאחרונה</small></div>
 </div>
 <div class="idrow">
  <span class="chip">🧑‍🧑‍🧒 195 מדינות <span class="flag-anim">🇮🇱</span></span>

</div>`;

const BG=[

 {n:311,name:'Mesh Spring',bg:'radial-gradient(at 20% 30%,#FCE7F3 0,transparent 50%),radial-gradient(at 80% 70%,#DBEAFE 0,transparent 50%),#FFFFFF'},

 // ── Dark / Premium (326-330) ──
 {sec:'Dark & Premium · כהים ופרימיום'},
 {n:326,name:'Dark Glass',bg:'#0F1115',dark:1},

 {n:328,name:'Midnight Mesh',bg:'radial-gradient(at 20% 30%,#1E1B4B 0,transparent 50%),radial-gradient(at 80% 70%,#312E81 0,transparent 50%),#0F1115',dark:1},
 {n:329,name:'Soft Charcoal',bg:'#1C1C1E',dark:1},
 {n:330,name:'Acc Spotlight Dark',bg:'radial-gradient(circle at center,#1E3A8A 0,#0F1115 70%)',dark:1}
];

const g=document.getElementById('grid');
BG.forEach(b=>{
 if(b.sec){g.insertAdjacentHTML('beforeend',`<div class="section-h"><b>${b.sec}</b></div>`);return;}
 g.insertAdjacentHTML('beforeend',`<div class="demo"><div class="demo-num">${b.n} <span>${b.name}</span></div><div class="demo-stage" style="background:${b.bg}">${HDR(b.dark)}</div></div>`);
});
</script>
</body>
</html>
